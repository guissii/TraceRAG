services:
  ollama:
    image: ollama/ollama:latest
    container_name: tracerag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracerag-api
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=phi3
      - CHROMA_PATH=/app/chroma_data
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - DEBUG=false
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ollama_data:
  chroma_data:

networks:
  default:
    name: tracerag-network
